    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts: Clash Display (display) + Satoshi (body) via Fontshare CDN -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />

      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@300,400,500,700&display=swap"

    <!-- Poppins (logo wordmark) + Fraunces italic (editorial accent words) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Fraunces:ital,wght@1,400;1,500;1,600&display=swap"
    />

    <title>Minterest — Where interest becomes your growth</title>
    <meta
      name="description"
      content="Minterest — a marketing agency where interest becomes your growth."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
